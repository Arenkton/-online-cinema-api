[project]
name = "online-cinema"
version = "0.1.0"
description = "REST API for an online cinema with JWT authentication, movie catalog, shopping cart, orders, and Stripe payments."
authors = [
    {name = "Arenkton"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.22.1,<0.23.0",
    "alembic>=1.20.1,<2.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "stripe[async]>=17.0.0,<18.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1.post1,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "flake8>=7.0,<8.0"
]
